<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Parent Dashboard</title>

    <style>
        body {
            background: #eef4ff;
            font-family: Arial;
            margin: 0;
        }

        h1 {
            background: #0a74ff;
            padding: 20px;
            color: white;
            text-align: center;
            margin: 0;
        }

        /* Logout Button */
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff3b3b;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
            margin-top: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .statBox {
            flex: 1;
            min-width: 200px;
            background: #d9e8ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #c5d5ff;
            background: #f4f7ff;
            text-align: center;
        }

        th {
            background: #d0e1ff;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAKk0ZMDOzjlK0y5B9vKRI4H99z8kR2m9I",
            authDomain: "smart-attendance-system-29984.firebaseapp.com",
            databaseURL: "https://smart-attendance-system-29984-default-rtdb.firebaseio.com",
            projectId: "smart-attendance-system-29984",
            storageBucket: "smart-attendance-system-29984.firebasestorage.app",
            messagingSenderId: "576562417490",
            appId: "1:576562417490:web:4a560edf0254d195e6348b",
            measurementId: "G-HK9N3D50X4"
        };
        firebase.initializeApp(firebaseConfig);

        // Logout Function
        function parentLogout() {
            firebase.auth().signOut().then(() => {
                localStorage.clear();
                window.location.href = "login.html"; // Redirect to login page
            });
        }
    </script>

    <script defer src="parent-dashboard.js"></script>

</head>

<body>

    <h1>Parent Dashboard</h1>

    <!-- LOGOUT BUTTON -->
    <button class="logout-btn" onclick="parentLogout()">Logout</button>

    <div class="container">

        <div class="box">
            <h2>Your Child: <span id="childName"></span></h2>

            <button onclick="loadAttendance()"
                style="padding:10px 20px; background:#0a74ff; color:white; border:none; border-radius:8px; cursor:pointer;">
                Load Attendance
            </button>
        </div>

        <div class="stats">
            <div class="statBox">
                <b id="presentCount">0</b><br>Present Days
            </div>
            <div class="statBox">
                <b id="absentCount">0</b><br>Absent Days
            </div>
            <div class="statBox">
                <b id="percent">0%</b><br>Total Attendance
            </div>
        </div>

        <div class="box">
            <h2>Attendance Table</h2>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="attendanceTable"></tbody>
            </table>
        </div>

    </div>

</body>

</html>
