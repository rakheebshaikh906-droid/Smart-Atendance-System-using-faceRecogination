<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Attendance Dashboard</title>

    <style>
        body {
            background: #eef4ff;
            font-family: Arial;
            margin: 0;
        }

        h1 {
            background: #0a74ff;
            padding: 20px;
            color: white;
            text-align: center;
            margin: 0;
        }

        .nav {
            text-align: center;
            padding: 10px;
            background: #f0f5ff;
        }

        .nav button {
            padding: 10px 18px;
            background: #d9e8ff;
            border: none;
            border-radius: 8px;
            margin: 5px;
            cursor: pointer;
        }

        .container {
            width: 90%;
            margin: auto;
            margin-top: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
            text-align: center;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .statBox {
            flex: 1;
            min-width: 200px;
            background: #d9e8ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            margin-top: 20px;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAKk0ZMDOzjlK0y5B9vKRI4H99z8kR2m9I",
            authDomain: "smart-attendance-system-29984.firebaseapp.com",
            databaseURL: "https://smart-attendance-system-29984-default-rtdb.firebaseio.com",
            projectId: "smart-attendance-system-29984",
            storageBucket: "smart-attendance-system-29984.firebasestorage.app",
            messagingSenderId: "576562417490",
            appId: "1:576562417490:web:4a560edf0254d195e6348b",
            measurementId: "G-HK9N3D50X4"
        };
        firebase.initializeApp(firebaseConfig);
    </script>

    <!-- Dashboard JS -->
    <script defer src="dashboard.js"></script>

</head>

<body>

    <h1>Attendance Dashboard</h1>

    <div class="nav">
        <button onclick="window.location='index.html'">Home</button>
        <button onclick="window.location='attendance.html'">Attendance</button>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="container">

        <!-- DATE RANGE PICKER -->
        <div class="box">
            <h2>Select Date Range</h2>

            <label>Start Date:</label><br>
            <input type="date" id="startDate"
                style="padding:10px; width:60%; border-radius:8px; border:1px solid #b5c8f5;"><br><br>

            <label>End Date:</label><br>
            <input type="date" id="endDate"
                style="padding:10px; width:60%; border-radius:8px; border:1px solid #b5c8f5;"><br><br>

            <button onclick="loadRangeAttendance()"
                style="padding:10px 20px; border:none; background:#0a74ff; color:white; border-radius:8px;">
                Show Attendance
            </button>
        </div>

        <!-- STUDENT FILTER -->
        <div class="box">
            <h2>Select Student (Optional)</h2>

            <select id="studentSelect" style="padding:10px; width:60%; border-radius:8px; border:1px solid #b5c8f5;">
                <option value="">-- All Students --</option>
            </select>
        </div>

        <!-- STATS -->
        <div class="stats">
            <div class="statBox">
                <b id="presentCount">0</b><br>Present
            </div>
            <div class="statBox">
                <b id="absentCount">0</b><br>Absent
            </div>
            <div class="statBox">
                <b id="percentage">0%</b><br>Attendance %
            </div>
        </div>

        <!-- GRAPH -->
        <div class="card">
            <h2>Date-wise Attendance Graph (Line Graph)</h2>
            <canvas id="studentChart" height="130"></canvas>
        </div>

    </div>

</body>

</html>
